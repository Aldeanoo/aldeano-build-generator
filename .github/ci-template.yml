name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_ai_bundle.py --check
      - run: python generator.py examples/casa_medieval.build.json --output output-smoke
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: samples-python-${{ matrix.python-version }}
          path: output-smoke/
